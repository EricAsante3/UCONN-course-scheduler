server {
    listen 443; # Listen on port 443 for HTTPS requests, if running locally change to 80 for HTTP
    server_name _;

    # --------------------
    # FRONTEND (Next.js)
    # --------------------
    location / {
        proxy_pass http://nextjs-frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --------------------
    # NODE BACKEND
    # --------------------
    location /node-backend/ {
        proxy_pass http://node-backend:5178/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --------------------
    # DOTNET BACKEND
    # --------------------
    location /net-backend/ {
        proxy_pass http://dotnet-backend:5041/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
