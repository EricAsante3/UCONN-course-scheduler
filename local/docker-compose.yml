version: "3.9"

networks:
  app-network:
    driver: bridge

services:
  # 🟩 Node backend
  node-backend:
    build: ./classDataFecthing-backend
    expose:
      - "5178"          # internal only
    restart: unless-stopped
    networks:
      - app-network

  # 🟦 .NET backend
  dotnet-backend:
    build: ./scheduling-backend
    expose:
      - "5041"          # internal only
    restart: unless-stopped
    networks:
      - app-network

  # 🟧 Next.js frontend
  nextjs-frontend:
    build:
      context: ./frontEnd-code
      args:
        NEXT_PUBLIC_IP_URL: "https://coursescheduler.engr.uconn.edu"
    expose:
      - "3000"          # internal only
    restart: unless-stopped
    networks:
      - app-network

  # 🧱 Nginx reverse proxy
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    depends_on:
      - nextjs-frontend
      - node-backend
      - dotnet-backend
    ports:
      - "3000:80"       # expose only this
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app-network
